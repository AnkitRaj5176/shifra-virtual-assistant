<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shifra — My Profile</title>
  <link rel="shortcut icon" href="logo.jpg" type="image/x-icon"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
  <style>
    .auth-card { max-width: 460px; gap: 0; }
    .back-btn {
      align-self: flex-start;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover { background: rgba(255,255,255,0.22); }
    .section-title {
      width: 100%;
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 18px 0 10px;
    }
    .divider-line {
      width: 100%;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.12);
      margin: 6px 0 14px;
    }
    .user-email-display {
      width: 100%;
      padding: 11px 14px 11px 42px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      color: rgba(255,255,255,0.45);
      font-size: 0.95rem;
      margin-bottom: 18px;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="auth-card">

    <a href="index.html" class="back-btn">← Back to Shifra</a>

    <img src="logo2.png" alt="Logo" class="auth-logo"/>
    <h2>My <span>Profile</span></h2>
    <p class="auth-subtitle" id="profileEmail">Loading...</p>

    <div class="msg" id="msg"></div>

    <!-- ── Update Name ── -->
    <p class="section-title">Update Name</p>
    <hr class="divider-line"/>
    <form id="nameForm" style="width:100%">
      <div class="form-group">
        <label for="newName">Full Name</label>
        <div class="input-wrap">
          <span class="icon">👤</span>
          <input type="text" id="newName" placeholder="Enter new name" required/>
        </div>
      </div>
      <button type="submit" class="auth-btn" style="margin-bottom:6px">💾 Update Name</button>
    </form>

    <!-- ── Update Password ── -->
    <p class="section-title" style="margin-top:24px">Change Password</p>
    <hr class="divider-line"/>
    <form id="passForm" style="width:100%">
      <div class="form-group">
        <label for="currentPass">Current Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="currentPass" placeholder="Current password" required/>
          <span class="toggle-pass" onclick="toggleField('currentPass', this)">👁️</span>
        </div>
      </div>
      <div class="form-group">
        <label for="newPass">New Password</label>
        <div class="input-wrap">
          <span class="icon">🔑</span>
          <input type="password" id="newPass" placeholder="New password (min 6 chars)" required/>
          <span class="toggle-pass" onclick="toggleField('newPass', this)">👁️</span>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="sFill"></div></div>
        <div class="strength-label" id="sLabel">Password strength</div>
      </div>
      <button type="submit" class="auth-btn">🔐 Update Password</button>
    </form>

    <!-- ── Clear Chat ── -->
    <p class="section-title" style="margin-top:24px">Chat History</p>
    <hr class="divider-line"/>
    <button class="auth-btn" id="clearChatBtn"
      style="background:linear-gradient(135deg,#ff4d4d,#ff7f50);margin-bottom:10px">
      🗑️ Clear All Chat History
    </button>

  </div>

  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('shifra_token');
    if (!token) window.location.href = 'login.html';

    // Load profile
    fetch(`${API}/user/profile`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(data => {
        if (data.user) {
          document.getElementById('newName').value = data.user.name;
          document.getElementById('profileEmail').textContent = '📧 ' + data.user.email;
        }
      });

    function showMsg(text, type) {
      const m = document.getElementById('msg');
      m.textContent = text;
      m.className = `msg ${type} show`;
      setTimeout(() => m.className = 'msg', 3500);
    }

    function toggleField(id, el) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      el.textContent = inp.type === 'password' ? '👁️' : '🙈';
    }

    // Password strength
    document.getElementById('newPass').addEventListener('input', function () {
      const v = this.value; let s = 0;
      if (v.length >= 6) s++; if (v.length >= 10) s++;
      if (/[A-Z]/.test(v)) s++; if (/[0-9]/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      const lvls = [
        {w:'0%',bg:'transparent',t:'Password strength'},
        {w:'25%',bg:'#ff4d4d',t:'🔴 Weak'},
        {w:'50%',bg:'#ffaa00',t:'🟡 Fair'},
        {w:'75%',bg:'#2ecc71',t:'🟢 Good'},
        {w:'100%',bg:'#00e5ff',t:'💪 Strong'},
        {w:'100%',bg:'#ffe600',t:'🔥 Very Strong'},
      ];
      const l = lvls[Math.min(s,5)];
      document.getElementById('sFill').style.width = l.w;
      document.getElementById('sFill').style.background = l.bg;
      document.getElementById('sLabel').textContent = l.t;
    });

    // Update name
    document.getElementById('nameForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const btn  = e.target.querySelector('.auth-btn');
      btn.textContent = '⏳ Updating...'; btn.disabled = true;
      const res  = await fetch(`${API}/user/update-name`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ name }),
      });
      const data = await res.json();
      btn.textContent = '💾 Update Name'; btn.disabled = false;
      if (res.ok) {
        showMsg(`✅ ${data.message}`, 'success');
        localStorage.setItem('shifra_current_user', JSON.stringify(data.user));
      } else {
        showMsg(`❌ ${data.message}`, 'error');
      }
    });

    // Update password
    document.getElementById('passForm').addEventListener('submit', async e => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPass').value;
      const newPassword     = document.getElementById('newPass').value;
      const btn = e.target.querySelector('.auth-btn');
      btn.textContent = '⏳ Updating...'; btn.disabled = true;
      const res  = await fetch(`${API}/user/update-password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ currentPassword, newPassword }),
      });
      const data = await res.json();
      btn.textContent = '🔐 Update Password'; btn.disabled = false;
      if (res.ok) {
        showMsg(`✅ ${data.message}`, 'success');
        document.getElementById('passForm').reset();
      } else {
        showMsg(`❌ ${data.message}`, 'error');
      }
    });

    // Clear chat
    document.getElementById('clearChatBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to clear all chat history?')) return;
      const res  = await fetch(`${API}/chat/clear`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (res.ok) showMsg('✅ Chat history cleared!', 'success');
      else showMsg('❌ Failed to clear history.', 'error');
    });
  </script>

</body>
</html>
