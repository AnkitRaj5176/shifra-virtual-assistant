<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    body {
      width: 220px; padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff; margin: 0;
    }
    .logo { text-align: center; font-size: 2rem; margin-bottom: 8px; }
    h3 { text-align: center; margin: 0 0 10px; color: #ffe600; font-size: 1rem; }
    .status {
      background: rgba(255,255,255,0.15);
      border-radius: 10px; padding: 10px;
      font-size: 0.82rem; text-align: center;
      color: rgba(255,255,255,0.85);
    }
    .dot { color: #2ecc71; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="logo">🤖</div>
  <h3>Shifra Extension</h3>
  <div class="status">
    <span class="dot">●</span> Active & Ready<br/>
    <small style="color:rgba(255,255,255,0.6)">Shifra can now open &amp; close tabs</small>
  </div>
</body>
</html>
